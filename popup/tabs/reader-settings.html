<div class="settings-panel">
  <div class="settings-group">
    <h3>Text Size</h3>
    <div class="font-size-controls">
      <button class="size-btn" data-size="smaller">A-</button>
      <span class="current-size">18px</span>
      <button class="size-btn" data-size="larger">A+</button>
    </div>
  </div>

  <div class="settings-group">
    <h3>Theme</h3>
    <div class="theme-selector">
      <div class="theme-option" data-theme="light">Light</div>
      <div class="theme-option" data-theme="dark">Dark</div>
      <div class="theme-option" data-theme="sepia">Sepia</div>
      <div class="theme-option" data-theme="custom">Custom</div>
    </div>
  </div>

  <div class="settings-group">
    <h3>Line Height</h3>
    <input type="range" min="1.2" max="2" step="0.1" value="1.6" id="lineHeight">
  </div>

  <div class="settings-group">
    <h3>Margins</h3>
    <input type="range" min="1" max="4" step="0.5" value="2" id="margins">
  </div>
</div>
