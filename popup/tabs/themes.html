<div class="mode-section">
  <!-- Immersive Mode -->
  <div class="mode-header">
    <h3>Immersive Mode</h3>
    <label class="switch">
      <input type="checkbox" id="immersiveModeToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Reader Mode -->
  <div class="mode-header">
    <h3>Reader Mode</h3>
    <label class="switch">
      <input type="checkbox" id="readerModeToggle">
      <span class="slider round"></span>
    </label>
  </div>
  <div id="readerModeOptions" class="mode-options hidden">
    <div class="option-group">
      <button id="downloadPage" class="action-button">
        <i class="fas fa-download"></i> Download Page
      </button>
      <button id="copyLink" class="action-button">
        <i class="fas fa-link"></i> Copy Link
      </button>
    </div>
    <div class="annotation-tools">
      <div class="tool-group">
        <button class="annotation-tool" data-type="highlight">
          <i class="fas fa-highlighter"></i>
        </button>
        <button class="annotation-tool" data-type="note">
          <i class="fas fa-sticky-note"></i>
        </button>
        <button class="annotation-tool" data-type="underline">
          <i class="fas fa-underline"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Proofreading Mode -->
  <div class="mode-header">
    <h3>Proofreading Mode</h3>
    <label class="switch">
      <input type="checkbox" id="proofReadingToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <!-- 子功能区域 -->
  <div id="proofReadingOptions" class="options-container hidden">
    <label class="sub-switch-label">
      Focus Highlight
      <input type="checkbox" id="focusHighlightToggle" class="switch-input">
      <span class="slider"></span>
    </label>
    <label class="sub-switch-label">
      Gradient Flow
      <input type="checkbox" id="gradientFlowToggle" class="switch-input">
      <span class="slider"></span>
    </label>
    <label class="sub-switch-label">
      Smart Keywords
      <input type="checkbox" id="smartKeywordsToggle" class="switch-input">
      <span class="slider"></span>
    </label>
  </div>
</div>
