<div class="mode-section">
  <!-- Immersive Mode -->
  <div class="mode-header">
    <h3>Immersive Mode</h3>
    <label class="switch">
      <input type="checkbox" id="immersiveModeToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Reader Mode -->
  <div class="mode-header">
    <h3>Reader Mode</h3>
    <label class="switch">
      <input type="checkbox" id="readerModeToggle">
      <span class="slider round"></span>
    </label>
  </div>
  <div id="readerModeOptions" class="mode-options hidden">
    <div class="option-group">
      <button id="downloadPage" class="action-button">
        <i class="fas fa-download"></i> Download Page
      </button>
      <button id="copyLink" class="action-button">
        <i class="fas fa-link"></i> Copy Link
      </button>
    </div>
    <div class="annotation-tools">
      <div class="tool-group">
        <button class="annotation-tool" data-type="highlight">
          <i class="fas fa-highlighter"></i>
        </button>
        <button class="annotation-tool" data-type="note">
          <i class="fas fa-sticky-note"></i>
        </button>
        <button class="annotation-tool" data-type="underline">
          <i class="fas fa-underline"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Proofreading Mode -->
  <div class="mode-header">
    <h3>Proofreading Mode</h3>
    <label class="switch">
      <input type="checkbox" id="proofReadingToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <!-- 子功能区域 -->
  <div id="proofReadingOptions" class="mode-options hidden">
    <div class="option-item">
      <label>
        <input type="checkbox" id="highlightFirstLetters">
        Highlight first letters
      </label>
      <input type="number" id="letterCount" min="1" max="5" value="3" class="small-input">
    </div>
    
    <div class="option-item">
      <label>
        <input type="checkbox" id="sentenceGradient">
        Sentence gradient
      </label>
      <select id="gradientStyle">
        <option value="subtle">Subtle</option>
        <option value="medium">Medium</option>
        <option value="strong">Strong</option>
      </select>
    </div>
    
    <div class="option-item">
      <label>
        <input type="checkbox" id="smartKeywords">
        Smart keywords
      </label>
      <input type="text" id="apiEndpoint" 
             placeholder="API endpoint (optional)" 
             class="full-width">
    </div>
  </div>
</div>
