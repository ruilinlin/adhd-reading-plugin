<div class="module">
  <!-- Focus Highlight Settings -->
  <div id="focusHighLightOptions" class="settings-group">
    <h3>Focus Highlight</h3>
    <div class="option-row">
      <label>
        Highlight Width
        <input type="range" id="highlightWidth" min="1" max="5" value="3">
      </label>
    </div>
    <!-- Add more focus highlight options -->
  </div>
  
  <!-- Gradient Flow Settings -->
  <div id="gradientFlowOptions" class="settings-group">
    <h3>Gradient Flow</h3>
    <div class="option-row">
      <label>
        Flow Speed
        <input type="range" id="flowSpeed" min="1" max="10" value="5">
      </label>
    </div>
    <!-- Add more gradient flow options -->
  </div>
</div>

  <!-- <h2>Settings</h2> -->
  <label>
    <span>Opacity</span>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.8">
  </label>
  <br>
  <label>
    <span>Color Theme</span>
    <input type="color" id="colorPicker">
  </label>



</div>
